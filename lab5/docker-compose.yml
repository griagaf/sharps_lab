# История и 6 преподавателей. Студент запускается отдельно: dotnet run --project lab5/Lab5.Student

# Общее для всех преподавателей: один образ, отличаются только предметом и портом.
x-teacher: &teacher
  build:
    context: .
    dockerfile: Lab5.Teacher/Dockerfile
  image: lab5-teacher
  depends_on:
    - history

x-teacher-env: &teacher-env
  Teacher__HistoryUrl: http://history:8080

services:
  history:
    build:
      context: .
      dockerfile: Lab5.History/Dockerfile
    image: lab5-history
    ports:
      - "5100:8080"

  teacher-calculus:
    <<: *teacher
    environment:
      <<: *teacher-env
      Teacher__Subject: Calculus
    ports:
      - "5101:8080"

  teacher-linear-algebra:
    <<: *teacher
    environment:
      <<: *teacher-env
      Teacher__Subject: LinearAlgebra
    ports:
      - "5102:8080"

  teacher-discrete-math:
    <<: *teacher
    environment:
      <<: *teacher-env
      Teacher__Subject: DiscreteMath
    ports:
      - "5103:8080"

  teacher-programming:
    <<: *teacher
    environment:
      <<: *teacher-env
      Teacher__Subject: Programming
    ports:
      - "5104:8080"

  teacher-physics:
    <<: *teacher
    environment:
      <<: *teacher-env
      Teacher__Subject: Physics
    ports:
      - "5105:8080"

  teacher-english:
    <<: *teacher
    environment:
      <<: *teacher-env
      Teacher__Subject: English
    ports:
      - "5106:8080"
